<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luminous Audit 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 시안 비교용 셸. 상단 컨트롤바(A/B/C 전환, 해볼 일 체크리스트) + 1440x810 앱 스테이지(화면 폭에 맞춰 축소). 제품 UI는 라이트 단일 룩으로 고정. */
:root{--bg:#EEF0F4;--surface:#FFFFFF;--panel:#F1F3F6;--sub:#F6F7F9;--line:#D5D8DE;--hair:#ECEEF2;--ink:#14171D;--mut:#5F6672;--acc:#2F6BFF;--acc-t:#EAF0FF;--acc-x:#1F4FCC;--ok:#1E7A4F;--warn:#B4412A;--font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:15px;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
.ctl{max-width:1440px;margin:0 auto 12px;display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ctl h1{font-size:17px;margin:0;font-weight:600}
.lay{display:flex;gap:6px;flex-wrap:wrap}
.lay button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14px;line-height:20px}
.lay button b{font-weight:600}
.lay button.on{background:var(--ink);color:#fff;box-shadow:none}
.lay button:focus-visible,.app button:focus-visible,.app input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tasks{max-width:1440px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut)}
.tasks span.t{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.tasks span.t.d{color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tasks button{all:unset;cursor:pointer;margin-left:auto;padding:4px 10px;border-radius:99px;box-shadow:0 0 0 1px var(--line);background:var(--surface)}
.fit{max-width:1440px;margin:0 auto;position:relative;overflow:hidden;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(20,23,29,.08)}
.app{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;background:var(--surface);overflow:hidden;font-family:var(--font);font-size:15px;line-height:22px;color:var(--ink)}
.abs{position:absolute}
.top{position:absolute;left:0;top:0;width:1440px;height:48px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);z-index:5}
.top.c{height:56px}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;width:320px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.logo span{color:var(--mut)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel);align-items:center}
.seg button{all:unset;cursor:pointer;height:30px;padding:0 14px;border-radius:9px;display:flex;gap:8px;align-items:center;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #E3E6EB,0 2px 6px rgba(20,23,29,.06)}
.seg .n{min-width:22px;height:22px;border-radius:11px;background:#E3E6EB;color:var(--mut);font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.seg .on .n{background:var(--acc);color:#fff}
.seg .arr{color:#A5A9B3;padding:0 2px}
.right-top{width:320px;display:flex;justify-content:flex-end;align-items:center;gap:16px;font-size:14px;color:var(--mut)}
.av{width:28px;height:28px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px #E3E6EB}
.left{position:absolute;left:0;top:48px;width:240px;height:762px;border-right:1px solid var(--hair);padding:12px;overflow:hidden;background:var(--surface)}
.cap{font-size:14px;color:var(--mut)}
.sec-h{font-size:14px;color:var(--mut);padding:14px 12px 6px}
.li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border-radius:10px;font-size:15px;line-height:20px}
.li:hover{background:var(--sub)}
.li>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.on{background:var(--panel);font-weight:600}
.li.done{color:var(--mut)}
.li small{flex-shrink:0;font-size:14px;color:var(--mut);font-weight:400;white-space:nowrap}
.li .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:8px;display:inline-block}
.ro{display:flex;justify-content:space-between;padding:6px 12px;font-size:15px;color:var(--mut)}
.canvas{position:absolute;top:48px;overflow:hidden;background-color:#FBFBFC;background-image:radial-gradient(#DDE0E6 1px,transparent 1.2px);background-size:24px 24px}
.card{position:absolute;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px #E3E6EB;padding:14px 16px;font-size:14px;line-height:20px;color:var(--mut);display:flex;flex-direction:column;gap:6px;transition:filter .2s,opacity .2s,box-shadow .2s;cursor:pointer;text-align:left}
.card b{font-size:16px;line-height:24px;font-weight:600;color:var(--ink)}
.card.dim{filter:blur(2.5px);opacity:.6}
.card.dim:hover{filter:blur(1px);opacity:.85}
.card.sel{box-shadow:0 0 0 2px var(--acc),0 10px 28px rgba(47,107,255,.18);cursor:default}
.card.noclick{cursor:default}
.hl{background:var(--acc-t);color:var(--ink);border-radius:6px;padding:3px 7px;transition:background .3s}
.hl.flash{background:#BFD3FF}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:14px;background:var(--panel);color:var(--mut);white-space:nowrap}
.tag.p{background:var(--acc-t);color:var(--acc-x)}
.tag.g{background:#E3F3EB;color:var(--ok)}
.chipx{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:14px;background:var(--acc-t);color:var(--acc-x);white-space:nowrap}
.slash{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:99px;font-size:14px;background:var(--sub);box-shadow:0 0 0 1px #E3E6EB;white-space:nowrap}
.slash:hover{background:var(--panel)}
.ddb{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:44px;border-radius:12px;background:var(--sub);box-shadow:0 0 0 1px #E3E6EB;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:500;font-size:14px}
.ddl{margin-top:6px;border-radius:12px;box-shadow:0 0 0 1px #E3E6EB,0 12px 28px rgba(20,23,29,.12);background:#fff;padding:6px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:5}
.ddl .g{font-size:13px;color:var(--mut);padding:8px 8px 2px}
.ddl button{all:unset;cursor:pointer;padding:8px;border-radius:8px;font-size:14px}
.ddl button:hover{background:var(--panel)}
.ddl button.on{background:var(--acc-t);color:var(--acc-x);font-weight:600}
.rE{position:absolute;left:1016px;top:48px;width:424px;height:762px;border-left:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column}
.ecat{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--hair)}
.ecat button{all:unset;cursor:pointer;padding:10px 10px;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.ecat button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.ecat .n{font-size:12px;background:var(--panel);border-radius:9px;padding:0 6px;line-height:18px;color:var(--mut)}
.esec-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-weight:600;font-size:14px}
.elist{overflow:auto;padding:0 16px 8px;display:flex;flex-direction:column;gap:8px;flex:0 1 auto;max-height:250px}
.econv{overflow:auto;padding:0 16px 8px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.egrp{border-radius:14px;box-shadow:0 0 0 1px #E3E6EB}
.egrp .eh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px}
.egrp .eb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.hint{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--mut);padding:2px 0}
.hint:hover{color:var(--ink)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 16px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{background:#2459D6}
.btn.sec{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.btn.sec:hover{background:var(--sub)}
.btn[disabled]{opacity:.45;cursor:default}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.38));backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 0 0 1px rgba(255,255,255,.85),0 0 0 2px rgba(190,196,208,.35),inset 0 1px 1px #fff,inset 0 -8px 14px -8px rgba(255,255,255,.95),0 14px 22px -10px rgba(20,23,29,.18),0 18px 36px rgba(47,107,255,.14)}
.haze{position:absolute;border-radius:50%;background:#DFE3EA;filter:blur(36px);opacity:.9;pointer-events:none}
.orb{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:linear-gradient(#fff,#F1F2F6);box-shadow:0 0 0 1px rgba(255,255,255,.9),inset 0 2px 3px #fff,inset 0 -5px 8px rgba(47,107,255,.12),0 10px 16px -6px rgba(20,23,29,.22);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:17px;flex-shrink:0}
.askin{all:unset;flex:1;min-width:0;font-size:15px;line-height:22px;color:var(--ink)}
.askin::placeholder{color:var(--mut)}
.right{position:absolute;left:1080px;top:48px;width:360px;height:762px;border-left:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;padding:12px 16px 10px;border-bottom:1px solid var(--hair)}
.tabs button{all:unset;cursor:pointer;height:32px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mut)}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600}
.tabs i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.sess{display:flex;gap:8px;padding:12px 16px 0}
.sess div{flex:1;height:40px;border-radius:12px;background:var(--sub);box-shadow:0 0 0 1px #E3E6EB;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:500}
.thread{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{border-radius:14px;box-shadow:0 0 0 1px #E3E6EB;padding:12px 14px;font-size:15px;line-height:22px;display:flex;flex-direction:column;gap:8px}
.prog{font-size:14px;line-height:20px;color:var(--mut);padding:0 4px}
.chg{border-radius:14px;box-shadow:0 0 0 1px #E3E6EB;padding:12px 14px}
.chg .h{display:flex;justify-content:space-between;font-weight:600;padding-bottom:6px}
.chg .h button{all:unset;cursor:pointer;font-weight:400;font-size:14px;color:var(--acc-x)}
.chg .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:20px;padding:6px 0;border-top:1px solid var(--hair)}
.chg.undone{opacity:.5}
.confirm{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pad{padding:0 16px 16px}
.box{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:112px}
.det{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.det .cap{margin-bottom:6px}
.valin{display:flex;align-items:center;height:44px;border-radius:12px;box-shadow:0 0 0 1px var(--line);background:#fff;padding:0 6px 0 14px;font-size:17px;font-weight:600;gap:6px}
.valin input{all:unset;width:70px;font-size:17px;font-weight:600;text-align:right;border-radius:6px}
.valin input:focus{background:var(--acc-t)}
.valin .st{display:flex;gap:2px;margin-left:auto}
.valin .st button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel);font-size:16px}
.ev{font-size:14px;line-height:21px;color:var(--mut);border-radius:10px;background:var(--sub);padding:10px 12px}
.resp{display:flex;gap:6px;flex-wrap:wrap}
.resp button{all:unset;cursor:pointer;height:28px;padding:0 12px;border-radius:99px;font-size:14px;background:var(--panel);color:var(--mut);display:flex;align-items:center}
.resp button.on{background:var(--acc-t);color:var(--acc-x);font-weight:600}
.toolbar{position:absolute;height:40px;padding:0 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E3E6EB,0 6px 16px rgba(20,23,29,.08);display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mut)}
.toast{position:absolute;right:24px;top:68px;z-index:20;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;line-height:20px;box-shadow:0 10px 24px rgba(20,23,29,.25);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.queue{position:absolute;left:0;top:56px;width:320px;height:754px;border-right:1px solid var(--hair);padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;overflow:hidden}
.qtabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--panel);margin:-4px 0 4px}
.qtabs button{all:unset;cursor:pointer;flex:1;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--mut)}
.qtabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #E3E6EB}
.qtabs .n{min-width:20px;height:20px;border-radius:10px;background:#E3E6EB;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.qtabs .on .n{background:var(--acc);color:#fff}
.fl{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 8px}
.chatp{position:absolute;left:0;top:48px;width:280px;height:762px;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:#fff}
.chatp .hd{padding:14px 16px;border-bottom:1px solid var(--hair);font-weight:600;display:flex;align-items:center;gap:8px}
.chatp .thread{flex:1;min-height:0}
.sug{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--hair)}
.sug button{all:unset;cursor:pointer;box-sizing:border-box;border-radius:12px;padding:8px 12px;font-size:14px;line-height:20px;background:var(--sub);box-shadow:0 0 0 1px #E3E6EB}
.sug button:hover{background:var(--panel)}
.rcol{position:absolute;left:1100px;top:48px;width:340px;height:762px;border-left:1px solid var(--hair);display:flex;flex-direction:column;background:#fff}
.rcol .hd{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.rlist{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.rc{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px #E3E6EB;display:flex;flex-direction:column;gap:8px;background:#fff}
.rc:hover{background:var(--sub)}
.rc.on{cursor:default;box-shadow:0 0 0 2px var(--acc),0 10px 24px rgba(47,107,255,.14)}
.rc.done{opacity:.7}
.rc b{font-size:16px;line-height:24px;font-weight:600}
.rc .src{font-size:14px;line-height:20px;color:var(--mut)}
.rc .chk{border-radius:10px;background:var(--sub);padding:10px 12px;font-size:14px;line-height:20px;display:flex;justify-content:space-between;gap:8px}
.rfoot{padding:12px 16px 16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.slash.on{background:var(--acc-t);color:var(--acc-x);box-shadow:0 0 0 1px var(--acc)}
.qi{all:unset;cursor:pointer;box-sizing:border-box;width:100%;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff;box-shadow:0 0 0 1px #E3E6EB}
.qi b{font-size:15px;line-height:22px;font-weight:600}
.qi span.s{font-size:14px;line-height:20px;color:var(--mut)}
.qi.on{box-shadow:0 0 0 2px var(--acc),0 8px 20px rgba(47,107,255,.14)}
.qi.done{opacity:.7}
.qi:hover{background:var(--sub)}
.prog-b{height:6px;border-radius:3px;background:#E3E6EB}
.prog-b i{display:block;height:6px;border-radius:3px;background:var(--acc);transition:width .3s}
.focus{position:absolute;left:320px;top:56px;width:1120px;height:754px;overflow:hidden;background-color:#FBFBFC;background-image:radial-gradient(#DDE0E6 1px,transparent 1.2px);background-size:24px 24px}
.dock{position:absolute;left:0;right:0;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.dec{width:720px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 10px 10px 20px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px #E3E6EB,0 12px 28px rgba(20,23,29,.10);transition:opacity .2s}
.dec.fade{opacity:.5}
.dec .b{display:flex;gap:8px;flex-shrink:0}
.pbar{width:720px;position:relative}
.pbar .glass{position:relative;height:60px;border-radius:30px;display:flex;align-items:center;gap:10px;padding:0 10px 0 20px;font-size:16px}
.apanel{position:absolute;left:724px;top:24px;width:372px;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;z-index:6}
.apanel .t{font-size:16px;line-height:25px;font-weight:500}
.evc{border-radius:12px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px #E3E6EB;padding:10px 12px;font-size:14px;line-height:20px;color:var(--mut)}
.evc b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.phone{position:absolute;border-radius:28px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:22px 20px;display:flex;flex-direction:column;font-size:14px;line-height:20px}
.cta{margin-top:12px;height:46px;border-radius:6px;background:#B8BDC8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;transition:background .3s}
.cta.fixed{background:var(--acc)}
.phone{background:#F3F3F4}
.phone .cta.fixed{background:#0F2A5C}
.pin{all:unset;cursor:pointer;position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.pin.on{box-shadow:0 0 0 2px var(--acc)}
.pin.dn{color:var(--mut);background:var(--panel)}
.pg{display:inline-block;width:13px;height:10px;border:1.5px solid currentColor;border-radius:2px;margin-right:8px;vertical-align:-1px;opacity:.7}
.new{animation:pop .5s ease-out}
@keyframes pop{from{box-shadow:0 0 0 3px var(--acc)}}
.sw{position:absolute;width:96px;height:96px;border-radius:18px;box-shadow:0 0 0 1px #E3E6EB;padding:10px 12px;display:flex;align-items:flex-end;font-size:14px;cursor:pointer;border:0;text-align:left;font-family:inherit}
.vgrid{position:absolute;display:grid;gap:8px}
.vgrid i{display:block;width:72px;height:56px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #E3E6EB;transition:all .3s}
.vgrid i.x{opacity:.15;transform:scale(.8)}
.vgrid i.k{box-shadow:0 0 0 2px var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== B·C 다크 (블러 & 백라이트) ===== */

  return '<div class="haze" style="left:'+(left-40)+'px;top:620px;width:'+(w+80)+'px;height:150px"></div><div class="abs" style="left:'+left+'px;top:612px;display:flex;gap:8px;flex-wrap:wrap;width:'+w+'px">'+chips+'</div><div class="glass abs" style="left:'+left+'px;top:654px;width:'+w+'px;height:60px;border-radius:30px;display:flex;align-items:center;gap:10px;padding:0 10px 0 18px"><span class="chipx">'+esc(chipLabel())+'</span><input class="askin" id="ask" value="'+esc(S.draft)+'" placeholder="질문 입력 · 예: '+suggestions(S.mode)[0]+'" autocomplete="off"><button class="orb" data-act="send" aria-label="보내기">↑</button></div>';
}
function viewD(){
  var m=S.mode,it=items(m),pend=it.filter(function(i){return i.pend}),list=pend.concat(it.filter(function(i){return !i.pend}));
  var chat='<div class="chatp"><div class="hd"><i style="width:8px;height:8px;border-radius:50%;background:var(--acc)"></i>대화</div>'+threadHtml()+'<div class="sug"><span class="cap">이런 요청</span>'+suggestions(m).map(function(q){return '<button data-act="chip" data-t="'+esc(q)+'">“'+esc(clb(q))+'”</button>'}).join('')+'</div></div>';
  var tabs=m==='check'?'<div class="abs" style="left:16px;top:6px;display:flex;gap:6px;z-index:3">'+['p1','p2','p3'].map(function(id){return '<button class="slash'+(S.screen===id?' on':'')+'" data-act="scr" data-id="'+id+'">'+SCRN[id]+(S.checked[id]?'':' · 점검 전')+'</button>'}).join('')+'</div>':'';
  var cv='<div class="canvas" style="left:280px;width:820px;height:762px">'+tabs+'<div style="position:absolute;left:0;top:0;width:840px;height:762px;transform:scale(.976);transform-origin:0 0">'+board()+'</div>'+barGen(80,660,suggestions(m))+'</div>';
  var ttl=m==='rules'?'추출된 룰 후보':m==='check'?'AI 진단':'추출된 항목';
  var right='<div class="rcol"><div class="hd"><div style="display:flex;gap:8px;align-items:center"><b style="font-weight:600">'+ttl+'</b><span class="tag p">'+it.length+'건</span></div><span class="cap">한 건씩 응답</span></div><div class="rlist">'+(list.length?list.map(rcard).join(''):'<div class="rc" style="cursor:default"><b>아직 점검 전</b><span class="src">화면을 고르고 /점검을 누르세요.</span></div>')+'</div><div class="rfoot"><div style="display:flex;justify-content:space-between"><span class="cap">미응답</span><b style="font-weight:600">'+pend.length+'건</b></div><button class="btn sec" data-act="holdall"'+(pend.length?'':' disabled')+'>전부 메모 보드에 저장</button></div></div>';
  return topC()+chat+cv+right;
}
function pageLabel(){return S.mode==='rules'?'룰 · 추출된 룰':S.mode==='check'?'화면 · '+SCRN[S.screen]:'디자인 시스템 · 컴포넌트'}
function entHtml(e,i){
  var h='';
  if(e.t==='user')h+='<div class="msg">'+'<span>'+esc(e.text)+'</span></div>';
  if(e.t==='prog')h+='<div class="prog">'+esc(e.text)+'</div>';
  if(e.t==='ans')h+='<div class="msg"><span>'+esc(e.text)+'</span>'+e.ev.map(function(v){return '<div class="evc" style="background:var(--sub)"><b>'+esc(v[0])+'</b>'+esc(v[1])+'</div>'}).join('')+(e.act&&!e.used?'<button class="btn pri" style="height:36px" data-act="apply" data-key="'+e.act.key+'" data-i="'+i+'">'+e.act.label+'</button>':'')+'</div>';
  if(e.t==='chg')h+='<div class="chg'+(e.undone?' undone':'')+'"><div class="h"><span>'+e.title+'</span>'+(e.undone?'<span style="font-weight:400;font-size:14px;color:var(--mut)">되돌림</span>':'<button data-act="undo" data-id="'+e.id+'">되돌리기</button>')+'</div>'+e.rows.map(function(r){return '<div class="r"><span>'+esc(r[1])+'</span><span style="color:var(--mut);white-space:nowrap">'+esc(r[0])+'</span></div>'}).join('')+'</div>';
  return h;
}
function convGroups(){
  var gs=[];
  S.thread.forEach(function(e,i){
    if(e.t==='user'){gs.push({k:i,m:e.m||'rules',chip:e.chip||'대화',ents:[[e,i]]});return}
    var g=gs[gs.length-1];
    if(e.t==='chg'&&(!g||g.m!==e.m)){gs.push({k:i,m:e.m||S.mode,chip:'변경 사항',ents:[[e,i]]});return}
    if(!g){gs.push({k:i,m:e.m||S.mode,chip:'대화',ents:[]});g=gs[gs.length-1]}
    g.ents.push([e,i]);
  });
  return gs;
}
function leftE(){
  var G=[['룰',[['rules','','추출된 룰']]],['화면 점검',['p1','p2','p3'].map(function(id){return ['check',id,SCRN[id]]})],['디자인 시스템',[['system','','컴포넌트 · 토큰']]]];
  var dd=S.dd?'<div class="ddl">'+G.map(function(g){return '<div class="g">'+g[0]+'</div>'+g[1].map(function(p){var on=S.mode===p[0]&&(p[0]!=='check'||S.screen===p[1]);return '<button class="'+(on?'on':'')+'" data-act="ddsel" data-m="'+p[0]+'" data-s="'+p[1]+'">'+p[2]+'</button>'}).join('')}).join('')+'</div>':'';
  return '<div class="abs" style="left:16px;top:14px;width:208px;z-index:6"><button class="ddb" style="background:#fff;box-shadow:0 0 0 1px #E3E6EB,0 8px 20px rgba(20,23,29,.10)" data-act="ddtog"><span>'+esc(pageLabel())+'</span><span style="color:var(--mut)">'+(S.dd?'⌃':'⌄')+'</span></button>'+dd+'</div>';
}
function rightE(){
  var m=S.mode,it=items(m),pend=it.filter(function(i){return i.pend}),list=pend.concat(it.filter(function(i){return !i.pend}));
  var cats=MODES.map(function(x){return '<button class="'+(S.mode===x[0]?'on':'')+'" data-act="mode" data-m="'+x[0]+'">'+x[2]+'<span class="n">'+cnt(x[0])+'</span></button>'}).join('');
  var gs=convGroups().filter(function(g){return g.m===m});
  var conv=gs.length?gs.map(function(g,gi){var last=gi===gs.length-1,open=S.gop[g.k]===undefined?last:S.gop[g.k];return '<div class="egrp"><button class="eh" data-act="gtog" data-k="'+g.k+'"><span class="chipx">'+esc(g.chip)+'</span><span class="cap">'+g.ents.length+'건</span><span style="margin-left:auto;color:var(--mut)">'+(open?'⌃':'⌄')+'</span></button>'+(open?'<div class="eb">'+g.ents.map(function(x){return entHtml(x[0],x[1])}).join('')+'</div>':'')+'</div>'}).join(''):'<div class="prog" style="padding:4px 2px">이 카테고리의 대화가 아직 없어요. 항목을 고르고 아래에서 요청해 보세요.</div>';
  return '<div class="rE"><div class="ecat">'+cats+'</div><div class="esec-h"><span>확인 대기 · '+it.length+'건</span><span class="cap" style="font-weight:400">한 건씩 응답</span></div><div class="elist">'+(list.length?list.map(rcard).join(''):'<div class="rc" style="cursor:default"><b>아직 점검 전</b><span class="src">화면을 고르고 /점검을 누르세요.</span></div>')+'</div><div class="esec-h"><span>대화 · '+gs.length+'</span><span class="cap" style="font-weight:400">대화별로 접고 펼쳐요</span></div><div class="econv" id="econv">'+conv+'</div>'+inputBox()+'</div>';
}
function viewE(){
  return topAB()+'<div class="canvas" style="left:0;width:1016px;height:762px"><div class="abs" style="left:120px;top:56px;width:840px;height:706px">'+board()+'</div><div class="toolbar" style="left:400px;top:698px"><b style="color:var(--ink);font-weight:600">선택</b><span>이동</span><span>코멘트</span><span>|</span><span>100%</span></div>'+leftE()+'</div>'+rightE();
}
function viewC(){return topC()+queue()+'<div class="focus">'+focusC()+answerPanel()+'</div>'+dock()}

/* ---------- render ---------- */
function renderCtl(){
  $('#lay').innerHTML=LAYS.map(function(l){return '<button role="tab" aria-selected="'+(S.layout===l[0])+'" class="'+(S.layout===l[0]?'on':'')+'" data-lay="'+l[0]+'"><b>'+l[3]+'안</b> · '+l[1]+'</button>'}).join('');
  $('#tasks').innerHTML='<span>해볼 일</span>'+TASKS.map(function(t){return '<span class="t'+(S.done[t[0]]?' d':'')+'">'+(S.done[t[0]]?'✓':'○')+' '+t[1]+'</span>'}).join('')+'<button id="reset">처음부터</button>';
}
function render(){
  var ae=document.activeElement,hadAsk=ae&&ae.id==='ask',pos=hadAsk?ae.selectionStart:0,hadVal=ae&&ae.id==='valin';
  app.className='app'+((S.layout==='A'||S.layout==='E')?'':' dk');
  app.innerHTML=(S.layout==='C'?viewC():S.layout==='D'?viewD():S.layout==='E'?viewE():S.layout==='B'?viewAB(true):viewAB(false))+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'');
  applyAI();renderCtl();
  if(hadAsk){var a=document.getElementById('ask');if(a){a.focus();try{a.setSelectionRange(pos,pos)}catch(e){}}}
  S.newIds={};S.emerge={};
  fit();
}
function fit(){
  var box=$('#fit'),w=box.clientWidth,sc=Math.min(1,w/1440);
  app.style.transform='scale('+sc+')';box.style.height=(810*sc)+'px';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var l=e.target.closest('[data-lay]');if(l){S.layout=l.getAttribute('data-lay');S.answer=null;S.tab='agent';render();return}
  if(e.target.id==='reset'){var lay=S.layout;S=null;S=seed();S.layout=lay;render();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='mode'){S.mode=t.getAttribute('data-m');S.answer=null;if(S.layout!=='C')S.tab='agent';render()}
  else if(a==='sel'){S.sel[S.mode]=t.getAttribute('data-id');if(S.mode==='check'){var dd=byId('check',S.sel.check);if(dd&&S.layout!=='A')S.screen=dd.scr;S.target='obj'}S.answer=null;if(S.layout!=='C')S.tab='detail';render()}
  else if(a==='holdall'){holdAll()}
  else if(a==='ltab'){S.leftTab=t.getAttribute('data-t');render()}
  else if(a==='flt'){S.flt=t.getAttribute('data-f');render()}
  else if(a==='scr'){S.screen=t.getAttribute('data-id');S.target='screen';S.answer=null;render()}
  else if(a==='tab'){S.tab=t.getAttribute('data-t');render()}
  else if(a==='chip'){ask(t.getAttribute('data-t'))}
  else if(a==='send'){var el=document.getElementById('ask');ask(el?el.value:S.draft)}
  else if(a==='apply'){var i=t.getAttribute('data-i');applyAct(t.getAttribute('data-key'),i==null?null:+i)}
  else if(a==='close-ans'){S.answer=null;render()}
  else if(a==='undo'){var id=t.getAttribute('data-id');if(S.changes[id]){S.changes[id]();delete S.changes[id];S.thread.forEach(function(x){if(x.id===id)x.undone=true});render()}}
  else if(a==='step'){var o=cur();if(o&&o.val!=null){o.val=Math.max(0,o.val+(+t.getAttribute('data-d')));markEdit(o);render()}}
  else if(a==='dec'){decide(t.getAttribute('data-k'))}
  else if(a==='ddtog'){S.dd=!S.dd;render()}
  else if(a==='ddsel'){S.mode=t.getAttribute('data-m');var ss=t.getAttribute('data-s');if(S.mode==='check'&&ss){S.screen=ss;S.target='screen'}S.dd=false;S.answer=null;render()}
  else if(a==='gtog'){var gk=t.getAttribute('data-k');var gcur=S.gop[gk];var gl=convGroups().filter(function(g){return g.m===S.mode});var isLast=gl.length&&String(gl[gl.length-1].k)===gk;S.gop[gk]=(gcur===undefined?!isLast:!gcur);render()}
  else if(a==='dvar'){var did=t.getAttribute('data-id');S.dv=(S.dv===did?'':did);S.emerge.dv=S.dv?1:0;render()}
  else if(a==='vtab'){S.vtab[t.getAttribute('data-c')]=t.getAttribute('data-t');render()}
  else if(a==='vtheme'){S.vtheme=t.getAttribute('data-k');render()}
  else if(a==='vprop'){var k=t.getAttribute('data-k');S.vres.B=k;logChange('변경 사항',[[k==='prop'?'새 컴포넌트 제안':'보류','Range Calendar']],function(){S.vres.B=''});toast(k==='prop'?'새 컴포넌트 제안으로 보냄':'보류함');render()}
  else if(a==='resp'){var k=t.getAttribute('data-k');if(k!=='pending')decide(k)}
  else if(a.indexOf('d-')===0){
    var k2=a.slice(2);
    if(k2==='ok')decide('ok');
    else if(k2==='hold')decide('hold');
    else if(k2==='src'){var el2=document.getElementById('hlq2')||document.getElementById('hlq');if(el2){el2.classList.add('flash');setTimeout(function(){el2.classList.remove('flash')},900)}}
    else if(k2==='fixbtn'){applyAct('fix',null)}
    else if(k2==='dvar'){var o3=cur();S.dv=(S.dv===o3.id?'':o3.id);S.emerge.dv=S.dv?1:0;render()}
    else if(k2==='memo'){var o2=cur();if(S.memos.indexOf(o2.id)<0)S.memos.push(o2.id);logChange('변경 사항',[['메모 저장',o2.n+' '+o2.name]],function(){S.memos=S.memos.filter(function(x){return x!==o2.id})});toast('메모 보드에 저장했어요')}
    else if(k2==='first'){nextPending();S.tab='detail';render()}
  }
});
function markEdit(o){if(o.state==='ai'||o.state==='confirmed'||o.state==='held'){var p=o.state;o.state='edited'}done('edit')}
document.addEventListener('input',function(e){
  if(e.target.id==='ask'){S.draft=e.target.value}
  if(e.target.id==='valin'){var o=cur();if(o&&o.val!=null){var v=parseFloat(e.target.value);if(!isNaN(v)&&v!==o.val){o.val=v;markEdit(o);var p=e.target.selectionStart;renderKeep(e.target.id,p)}}}
});
function renderKeep(id,pos){render();var el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener('keydown',function(e){
  if(e.target.id==='ask'&&e.key==='Enter'){e.preventDefault();ask(e.target.value);return}
  if(e.target.id==='valin'&&e.key==='Enter'){e.preventDefault();e.target.blur();return}
  if(S.layout==='C'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){
    if(e.key==='Enter'&&!/BUTTON/.test(e.target.tagName)){e.preventDefault();decide('ok')}
    if(e.key==='ArrowRight'){nextPending();render()}
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();var a=document.getElementById('ask');if(a)a.focus()}
});
window.addEventListener('resize',fit);
S=seed();render();
})();
</script>

<script>
/* ===== 자동 시연 (베스트 케이스) ===== */
(function(){
var Q=new URLSearchParams(location.search),SP=parseFloat(Q.get('speed')||'1')||1;
var AUTO=Q.has('demo');
var css='#dm{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;background:rgba(20,23,29,.92);color:#fff;font:500 15px/22px var(--font,sans-serif);box-shadow:0 12px 32px rgba(0,0,0,.28);max-width:min(1100px,94vw)}'
+'#dm .t{max-width:640px}#dm .s{font-size:13px;color:#A6BEFF;white-space:nowrap}#dm button{all:unset;white-space:nowrap;cursor:pointer;height:32px;min-width:32px;padding:0 10px;border-radius:16px;background:rgba(255,255,255,.12);text-align:center;font-size:13px;line-height:32px;box-sizing:border-box}#dm button:hover{background:rgba(255,255,255,.22)}'
+'#dm .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}#dm .dot.on{background:#6C9BFF}'
+'#dcur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;background:rgba(61,120,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.3);z-index:9998;pointer-events:none;transition:left .6s ease,top .6s ease,opacity .3s;opacity:0}'
+'#dcur.on{opacity:1}#dcur.p{transform:scale(.7);transition:left .6s ease,top .6s ease,transform .12s}'
+'#dcover{position:fixed;inset:0;z-index:9997;background:rgba(10,12,16,.55);display:none;align-items:center;justify-content:center;color:#fff;text-align:center;font:600 28px/40px var(--font,sans-serif)}#dcover small{display:block;font:400 16px/24px var(--font,sans-serif);color:#C9D2E8;margin-top:8px}'
+'body.demo #tasks{display:none}';
var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
var bar=document.createElement('div');bar.id='dm';document.body.appendChild(bar);
var cur=document.createElement('div');cur.id='dcur';document.body.appendChild(cur);
var cov=document.createElement('div');cov.id='dcover';document.body.appendChild(cov);
document.body.classList.add('demo');
var run=0,paused=false,playing=false,capText='',scIdx=0;
function sleep(ms){return new Promise(function(r){var t0=Date.now(),need=ms/SP;(function tick(){if(paused){setTimeout(tick,120);t0+=120;return}if(Date.now()-t0>=need)r();else setTimeout(tick,40)})()})}
function $(s,i){var l=document.querySelectorAll(s);i=i||0;if(i<0)i=l.length+i;return l[i]||null}
async function idle(){var t0=Date.now();await sleep(250);while(Date.now()-t0<9000/SP){var a=document.getElementById('app');if(!a.querySelector('.aiw,.ai-think,.scr-think')&&!/분석 중…|AI가 읽는 중/.test(a.innerText))return;await sleep(200)}}
async function waitSel(sel,i,ms){var t0=Date.now();while(Date.now()-t0<(ms||7000)/SP){var e=$(sel,i);if(e)return e;await sleep(150)}return null}
async function moveTo(e){
  var r=e.getBoundingClientRect();cur.classList.add('on');cur.style.left=(r.left+Math.min(r.width/2,60))+'px';cur.style.top=(r.top+r.height/2)+'px';await sleep(750)
}
async function click(sel,i,opt){
  if(sel.indexOf('data-act="chip"')>=0)await idle();var e=await waitSel(sel,i,opt&&opt.wait);if(!e){console.warn('demo: miss',sel,i,'|',(document.getElementById('app').innerText||'').replace(/\n+/g,' / ').slice(0,260));return false}
  try{e.scrollIntoView({block:'nearest'})}catch(x){}
  await moveTo(e);cur.classList.add('p');await sleep(160);var e2=$(sel,i)||e;e2.click();cur.classList.remove('p');await sleep(260);if(sel.indexOf('data-act="chip"')>=0){await idle();await sleep(900)}return true;
}
function cap(t,sub){capText=t;render(sub)}
var SC=[];
function render(sub){
  bar.innerHTML='<span class="t">'+capText+'</span><span class="s">'+(sub||'')+'</span>'+SC.map(function(s,i){return '<span class="dot'+(i===scIdx&&playing?' on':'')+'"></span>'}).join('')+'<button data-d="pp">'+(paused?'▶':'❚❚')+'</button><button data-d="prev">◀ 이전 안</button><button data-d="next">다음 안 ▶</button>';
}
bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.getAttribute('data-d');
  if(d==='pp'){paused=!paused;render()}
  if(d==='next')go(Math.min(scIdx+1,SC.length-1));
  if(d==='prev')go(Math.max(scIdx-1,0));
});
async function reset(L){var r=document.getElementById('reset');if(r)r.click();await sleep(200);var b=$('[data-lay="'+L+'"]');if(b)b.click();await sleep(300);}
function mk(L,name,fn){SC.push({L:L,name:name,fn:fn})}
var CH=function(t){return '[data-act="chip"][data-t="'+t+'"]'};
/* ---- A안 ---- */
mk('A','A안 · Copilot',async function(){
  cap('룰 · 인터뷰에서 뽑은 룰에 대해 AI에게 묻고, 직접 확정해요','A안 ①/3');await sleep(1200);
  await click('.right '+CH('이 룰 예외 있어?'));
  await click('.right [data-act="tab"][data-t="detail"]');await sleep(900);
  await click('[data-act="d-ok"]');await sleep(1400);
  cap('화면 점검 · 기획의도 점검을 돌리고, 수정안 보기를 눌러야 새 화면이 생겨요','A안 ②/3');
  await click('[data-act="mode"][data-m="check"]');await sleep(900);
  await click('.right '+CH('기획의도 점검'));
  await click('.right [data-act="apply"]',-1);await sleep(2200);

async function title(L,name,sub){
  cov.style.display='flex';cov.innerHTML='<div>'+name+'<small>'+sub+'</small></div>';await sleep(1800);cov.style.display='none';
}
async function go(i){
  run++;var my=run;scIdx=i;playing=true;
  var sc=SC[i];
  try{
    cur.classList.remove('on');
    await title(sc.L,sc.name,i===0?'배운다 · 점검한다 · 쌓는다 · AI는 제안하고 사람이 확정해요':'같은 흐름을 다른 구조로');
    if(my!==run)return;
    await reset(sc.L);render();
    await Promise.race([sc.fn(),new Promise(function(_,rj){var iv=setInterval(function(){if(my!==run){clearInterval(iv);rj('x')}},100)})]);
    if(my!==run)return;
    if(i<SC.length-1){go(i+1)}
    else{cur.classList.remove('on');cap('끝 · A/B/C안 흐름을 모두 보여드렸어요','다시 보려면 ◀ 이전 안');playing=false;render()}
  }catch(e){if(e!=='x')console.error(e)}
}
window.__demo={start:function(i){go(i||0)},sc:SC};
render();
if(AUTO){setTimeout(function(){go(0)},600)}
else{
  var hb=document.createElement('button');hb.textContent='▶ 자동 시연';hb.style.cssText='position:fixed;right:18px;top:16px;z-index:50;border:0;border-radius:999px;background:#14171D;color:#fff;padding:8px 16px;font:500 14px var(--font,sans-serif);cursor:pointer';hb.onclick=function(){hb.remove();go(0)};document.body.appendChild(hb);
  bar.style.display='none';
  hb.addEventListener('click',function(){bar.style.display='flex'});
}
})();
